name: Deploy Production

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: 🔍 CI Checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ╔══════════════════════════════════════════════╗
      # ║  TODO: Configure your production deploy here ║
      # ║  Examples:                                   ║
      # ║  - Vercel: npx vercel --prod --prebuilt      ║
      # ║  - Railway: railway up --environment prod    ║
      # ║  - Custom: rsync, docker push, etc.          ║
      # ╚══════════════════════════════════════════════╝
      - name: Deploy (placeholder)
        run: echo "🚀 Production deploy step - configure your deploy command here"

  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from commit
        id: version
        run: |
          # Extract version from merge commit message (e.g., "Merge branch 'release/1.0.0'")
          VERSION=$(git log -1 --pretty=%B | grep -oP "release/\K[0-9]+\.[0-9]+\.[0-9]+[^ ']*" || echo "")
          if [ -z "$VERSION" ]; then
            VERSION=$(git log -1 --pretty=%B | grep -oP "hotfix/\K[^ ']*" || echo "")
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(date +%Y.%m.%d)
          fi
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Release version: v$VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | head -n 1)
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}
